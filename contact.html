<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 fill=%22%231D1168%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-family=%22Georgia%22 font-size=%2218%22 fill=%22%23FCF8F2%22 text-anchor=%22middle%22%3EH%3C/text%3E%3Ccircle cx=%2226%22 cy=%226%22 r=%224%22 fill=%22%23D81746%22/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Werk met mij</title>
<meta name="description" content="Werk met Hazel Media: heb je een verhaal? Laten we kijken hoe we het in beeld kunnen brengen. Veenendaal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600;700&family=Caveat:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20260813-3">
<link rel="stylesheet" href="css/pages.css?v=20260813-3">
</head>
<body data-page="contact">
<div class="grain" aria-hidden="true"></div>

<section class="section" style="padding-top:calc(var(--nav-h) + 3rem)">
  <div class="wrap">
    <p class="eyebrow reveal">Werk met mij</p>
    <h1 class="reveal" style="font-size:clamp(2.8rem,8vw,6.5rem);margin-top:1rem;max-width:12ch">Heb je een <em class="accent">verhaal?</em></h1>
    <p class="lede reveal" style="max-width:44ch;color:var(--muted);font-size:1.15rem;margin-top:1.3rem">Laten we kijken hoe we het in beeld kunnen brengen.</p>

    <div class="contact-grid mt-4">
      <form class="reveal" id="contactForm" novalidate aria-describedby="contactStatus">
        <div class="co-row">
          <div class="co-field"><label for="naam">Naam *</label><input id="naam" name="naam" autocomplete="name" required></div>
          <div class="co-field"><label for="email">E-mail *</label><input id="email" name="email" type="email" autocomplete="email" required></div>
        </div>
        <div class="co-row">
          <div class="co-field"><label for="telefoon">Telefoon</label><input id="telefoon" name="telefoon" type="tel" autocomplete="tel"></div>
          <div class="co-field"><label for="bedrijf">Bedrijf</label><input id="bedrijf" name="bedrijf" autocomplete="organization"></div>
        </div>
        <div class="co-field">
          <label for="onderwerp">Waar kan ik je mee helpen?</label>
          <select id="onderwerp" name="onderwerp">
            <option>Redacteur</option><option>Producer</option><option>Camera-journalist</option>
            <option>Fotograaf</option><option>Videograaf</option><option>Drone</option><option>Anders</option>
          </select>
        </div>
        <div class="co-field">
          <label for="referentie">Referentie / opdracht</label><input id="referentie" name="referentie">
        </div>
        <div class="co-field"><label for="bericht">Bericht *</label><textarea id="bericht" name="bericht" rows="5" required></textarea></div>
        <div class="honeypot" aria-hidden="true"><label for="website">Laat dit veld leeg</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
        <div class="co-field consent"><label><input type="checkbox" name="privacy" required> Ik ga ermee akkoord dat mijn gegevens worden gebruikt om op deze aanvraag te reageren. *</label></div>
        <button class="btn btn--solid" type="submit" style="width:100%;justify-content:center">Vertel je verhaal <span class="arr">→</span></button>
        <p id="contactStatus" class="form-status" role="status" aria-live="polite"></p>
      </form>

      <div class="contact-details reveal" data-delay="1">
        <div class="c-detail"><span class="ic">◉</span><div><b>Gebaseerd in</b><span>Veenendaal, Nederland</span></div></div>
        <div class="c-detail"><span class="ic">✉</span><div><b>E-mail</b><a href="mailto:contact@annavandenhazel.nl">contact@annavandenhazel.nl</a></div></div>
        <div class="c-detail"><span class="ic">☎</span><div><b>Telefoon</b><a href="tel:0682253202">0682253202</a></div></div>
        <div class="c-detail"><span class="ic">in</span><div><b>LinkedIn</b><a href="https://linkedin.com/in/anna-van-den-hazel-895403227" target="_blank" rel="noopener">Anna van den Hazel</a></div></div>
        <div class="c-detail"><span class="ic">◎</span><div><b>Instagram</b><span>hazelmedia.nl</span></div></div>
      </div>
    </div>
  </div>
</section>

<script src="js/data.js?v=20260813-3"></script>
<script type="module" src="js/main.js?v=20260813-3"></script>
<script type="module" src="js/contact.js?v=20260813-3"></script>
</body>
</html>
